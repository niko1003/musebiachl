name: musebiachl
description: Displaying music sheets for musicians of a wind / brass band.
version: 1.14.0+32


# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  # Direct, because a Stimme made available offline is downloaded into a cache manager of
  # our own (MusePages) rather than the package's default one - see offline_store.dart.
  flutter_cache_manager: ^3.4.2
  # Only for that store's file system: the pages belong in the application support
  # directory, not the temporary one Android empties by itself.
  path_provider: ^2.1.6
  file: ^7.0.1
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  # Android 8+ composes the launcher icon itself and masks it to whatever shape the
  # launcher likes, so the flower is handed over on its own, inside the 66% safe zone,
  # with the corporate green behind it.
  adaptive_icon_background: "#0A8B31"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets: 
    - assets/images/
  fonts:
    # The corporate design's two: Noto Serif SemiBold for headings, Fira Sans for
    # everything that is read rather than scanned. Both are OFL; the licences sit beside
    # them in assets/fonts. Bundled rather than asked of the system, because no Android
    # has Fira Sans and the app would silently fall back to Roboto.
    - family: Fira Sans
      fonts:
        - asset: assets/fonts/FiraSans-Regular.ttf
        - asset: assets/fonts/FiraSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraSans-SemiBold.ttf
          weight: 600
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600